<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACRI HR Portal · Admin</title>
<link rel="icon" href="../assets/acri.png">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div id="app"></div>

<script src="../config.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  var H = window.HR, esc = H.esc, app = document.getElementById('app');
  var KEY = 'acri_hr_admin';
  var state = { token: sessionStorage.getItem(KEY), data: null, tab: location.hash.slice(1) || 'overview', prog: null };
  var today = new Date().toISOString().slice(0, 10);

  function api(action, body) {
    return H.call(Object.assign({ action: action, token: state.token }, body || {})).then(function (r) {
      if (!r.ok && /log in|expired/i.test(r.error || '')) logout();
      if (r.ok && r.data) { state.data = r.data; render(); }
      if (!r.ok && !document.querySelector('.modal-bg')) H.toast(r.error);
      return r;
    });
  }
  function logout() { if (state.token) H.call({ action: 'logout', token: state.token }); sessionStorage.removeItem(KEY); state.token = null; state.data = null; renderLogin(); }

  function renderLogin(err) {
    app.innerHTML = '<div class="login"><div class="box"><img src="../assets/acri.png" alt="ACRI"><h1>ACRI HR Portal</h1><p class="lead">Admin console</p>' +
      (err ? '<div class="note err">' + esc(err) + '</div>' : '') +
      '<form id="lf"><label class="f">Email<input class="i" name="email" type="email" required autocomplete="username"></label>' +
      '<label class="f">Password<input class="i" name="password" type="password" required autocomplete="current-password"></label>' +
      '<button class="btn" type="submit">Log in</button></form></div></div>';
    document.getElementById('lf').onsubmit = function (e) {
      e.preventDefault(); var f = e.target, b = f.querySelector('button'); b.disabled = true; b.textContent = 'Logging in…';
      H.call({ action: 'login', role: 'admin', email: f.email.value, password: f.password.value }).then(function (r) {
        if (!r.ok) return renderLogin(r.error);
        state.token = r.token; state.data = r.data; sessionStorage.setItem(KEY, r.token); render();
      });
    };
  }

  // ---------- helpers ----------
  function d() { return state.data; }
  function prog() { var ps = d().programmes; return ps.filter(function (p) { return p.id === state.prog; })[0] || ps[0]; }
  function facsOf(pid) { var ids = d().assignments.filter(function (a) { return a.programme_id === pid && a.status !== 'ended'; }).map(function (a) { return a.facilitator_id; }); return d().facilitators.filter(function (f) { return ids.indexOf(f.id) >= 0; }); }
  function table(head, rows, empty) { return '<div class="scroll"><table class="t"><thead><tr>' + head.map(function (h) { return '<th' + (h[0] === '#' ? ' class="num"' : '') + '>' + esc(h.replace(/^#/, '')) + '</th>'; }).join('') + '</tr></thead><tbody>' + (rows.join('') || '<tr><td colspan="' + head.length + '" class="empty">' + esc(empty || 'Nothing here yet.') + '</td></tr>') + '</tbody></table></div>'; }
  function card(title, body, tools) { return '<div class="card"><div class="hd"><h2>' + esc(title) + '</h2><div class="sp"></div>' + (tools || '') + '</div><div class="bd flush">' + body + '</div></div>'; }
  var MODEL = { share: 'Lump sum split between facilitators', tbd: 'To be decided', per_session: 'Flat rate per session', pool: 'Per-student amount ÷ planned sessions', fund: 'ACRI Abhivyakti Fund pool ÷ planned sessions' };
  var ROLE = { owner: 'Owner', vp: 'Vice President', admin: 'Admin' };

  // ---------- tabs ----------
  var TABS = [
    ['overview', 'Overview'], ['attendance', 'Attendance'], ['payments', 'Payments'], ['fund', 'Abhivyakti Fund'],
    ['facilitators', 'Facilitators'], ['programme', 'Programme & Sessions'], ['queries', 'Queries'], ['emails', 'Emails'], ['team', 'Team & Settings']
  ];

  function render() {
    var x = d(), c = x.counts;
    if (!state.prog && x.programmes[0]) state.prog = x.programmes[0].id;
    var badge = { attendance: c.claims, payments: c.pendingPay, queries: c.openQueries };
    app.innerHTML = '<div class="topbar"><div class="in"><img src="../assets/acri.png" alt="ACRI"><div class="t">ACRI HR Portal<small>Admin console</small></div><div class="sp"></div>' +
      (x.programmes.length > 1 ? '<select class="i" id="ps" style="width:auto;margin:0">' + x.programmes.map(function (p) { return '<option value="' + p.id + '"' + (p.id === state.prog ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('') + '</select>' : '') +
      '<div class="who"><b>' + esc(x.me.name || '') + '</b>' + esc(ROLE[x.me.role] || '') + '</div><button class="btn ghost sm" id="lo">Log out</button></div><div class="stripe"></div></div>' +
      '<div class="wrap"><div class="tabs">' + TABS.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (state.tab === t[0] ? 'on' : '') + '">' + t[1] + (badge[t[0]] ? '<span class="badge">' + badge[t[0]] + '</span>' : '') + '</button>'; }).join('') + '</div>' +
      '<div id="view">' + (VIEWS[state.tab] || VIEWS.overview)() + '</div></div>';
    document.getElementById('lo').onclick = logout;
    var ps = document.getElementById('ps'); if (ps) ps.onchange = function () { state.prog = ps.value; render(); };
    app.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { state.tab = b.dataset.tab; location.hash = state.tab; render(); }; });
    (BIND[state.tab] || function () {})();
  }

  var VIEWS = {}, BIND = {};

  VIEWS.overview = function () {
    var p = prog(), x = d(), f = p ? p.fund : null;
    var pays = x.payments.filter(function (y) { return y.programme_id === (p && p.id); });
    var outs = x.payouts.filter(function (y) { return y.programme_id === (p && p.id); });
    function sum(st) { return pays.filter(function (y) { return y.status === st; }).reduce(function (a, y) { return a + Number(y.net || 0); }, 0) + outs.filter(function (y) { return y.status === st; }).reduce(function (a, y) { return a + Number(y.amount || 0); }, 0); }
    var todo = [];
    if (x.counts.claims) todo.push('<b>' + x.counts.claims + '</b> attendance submission(s) to verify · <a href="#attendance" data-go="attendance">Attendance</a>');
    if (x.counts.pendingPay) todo.push('<b>' + x.counts.pendingPay + '</b> payment(s) pending approval · <a href="#payments" data-go="payments">Payments</a>');
    if (x.counts.awaitingFunds) todo.push('<b>' + x.counts.awaitingFunds + '</b> payment(s) awaiting funds in the ACRI Abhivyakti Fund · <a href="#fund" data-go="fund">Fund</a>');
    if (x.counts.openQueries) todo.push('<b>' + x.counts.openQueries + '</b> open querie(s) · <a href="#queries" data-go="queries">Queries</a>');
    if (p && p.share) { var due = p.share.lines.reduce(function (t, l) { return t + l.due; }, 0); if (due > 0) todo.push('<b>' + H.money(due) + '</b> in facilitator shares ready to pay out · <a href="#payments" data-go="payments">Payments</a>'); }
    if (p && p.session_net == null && p.pay_model !== 'share') todo.push('The payment rate for <b>' + esc(p.name) + '</b> is not set yet · <a href="#programme" data-go="programme">Programme</a>');
    return '<h1>' + esc(p ? p.name : 'No programme') + '</h1><p class="lead">' + esc(p ? p.school : '') + ' · ' + (p ? esc(MODEL[p.pay_model]) : '') + (p && p.session_net != null && p.pay_model !== 'share' ? ' · ' + H.money(p.session_net) + ' per session' : '') + '</p>' +
      '<div class="stats"><div class="stat hl"><div class="k">Fund available</div><div class="v">' + H.money(f ? f.available : 0) + '</div><div class="s">for facilitator payments</div></div>' +
      '<div class="stat"><div class="k">Paid</div><div class="v">' + H.money(sum('paid')) + '</div></div>' +
      '<div class="stat"><div class="k">Approved, unpaid</div><div class="v">' + H.money(sum('approved')) + '</div></div>' +
      '<div class="stat"><div class="k">Pending approval</div><div class="v">' + H.money(sum('pending')) + '</div></div></div>' +
      card('To do', todo.length ? '<div style="padding:12px 18px">' + todo.map(function (t) { return '<div style="padding:4px 0">' + t + '</div>'; }).join('') + '</div>' : '<div class="empty">All caught up.</div>');
  };
  BIND.overview = function () { app.querySelectorAll('[data-go]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); state.tab = a.dataset.go; location.hash = state.tab; render(); }; }); };

  VIEWS.attendance = function () {
    var p = prog(), x = d(), facs = facsOf(p.id);
    var claims = x.attendance.filter(function (a) { return a.status === 'claimed'; }).map(function (a) {
      return '<tr><td><b>' + esc(a.facilitator) + '</b></td><td>Session ' + esc(a.number) + ' · ' + H.date(a.date) + '</td><td class="small">' + esc(a.claim_note || '—') + '</td><td><div class="row-actions">' +
        '<button class="btn sm ok" data-v="approve" data-id="' + a.id + '">Verify present</button><button class="btn sm ghost" data-v="absent" data-id="' + a.id + '">Mark absent</button><button class="btn sm danger" data-v="reject" data-id="' + a.id + '">Reject</button></div></td></tr>';
    });
    var sess = x.sessions.filter(function (s) { return s.programme_id === p.id; });
    var grid = sess.map(function (s) {
      return '<tr><td><b>' + esc(s.number) + '</b>' + (s.extra === 'TRUE' ? ' <span class="pill blue">Extra</span>' : '') + '</td><td>' + H.date(s.date) + '<div class="small muted">' + esc(s.mode) + (s.status === 'cancelled' ? ' · cancelled' : '') + '</div></td>' + facs.map(function (f) {
        var a = x.attendance.filter(function (y) { return y.session_id === s.id && y.facilitator_id === f.id; })[0];
        return '<td>' + (a ? H.pill(H.ATT, a.status) : '<span class="pill">—</span>') + (s.date <= today && s.status !== 'cancelled' ? ' <button class="btn sm ghost" data-mark="' + s.id + '|' + f.id + '">Set</button>' : '') + '</td>';
      }).join('') + '</tr>';
    });
    return card('Submissions to verify', table(['Facilitator', 'Session', 'Note', 'Decision'], claims, 'No submissions waiting.')) +
      card('Attendance register', table(['Session', 'Date'].concat(facs.map(function (f) { return f.name; })), grid, 'No sessions yet.'), '<span class="small muted">Absent means no payment for that session</span>');
  };
  BIND.attendance = function () {
    app.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () {
        var dec = b.dataset.v;
        if (dec === 'approve') return api('verifyClaim', { attendance_id: b.dataset.id, decision: 'approve' }).then(function (r) { if (r.ok) H.toast('Verified. Email sent.'); });
        H.form(dec === 'reject' ? 'Reject attendance (discrepancy)' : 'Mark as absent', [{ name: 'remarks', label: dec === 'reject' ? 'Reason for rejection' : 'Remarks (optional)', type: 'textarea', required: dec === 'reject' }], dec === 'reject' ? 'Reject' : 'Mark absent',
          function (v) { return api('verifyClaim', { attendance_id: b.dataset.id, decision: dec, remarks: v.remarks }); });
      };
    });
    app.querySelectorAll('[data-mark]').forEach(function (b) {
      b.onclick = function () {
        var ids = b.dataset.mark.split('|');
        H.form('Record attendance', [{ name: 'status', label: 'Status', type: 'select', options: [['present', 'Present'], ['absent', 'Absent (not paid)']] }, { name: 'remarks', label: 'Remarks', type: 'textarea' }, { name: 'notify', label: 'Email the facilitator', type: 'checkbox', value: true }], 'Save',
          function (v) { return api('markAttendance', { session_id: ids[0], facilitator_id: ids[1], status: v.status, remarks: v.remarks, notify: v.notify }); });
      };
    });
  };

  VIEWS.payments = function () {
    var p = prog(), x = d();
    if (p.pay_model === 'share') return sharePayments(p, x);
    var rows = x.payments.filter(function (y) { return y.programme_id === p.id && y.status !== 'not_payable'; })
      .sort(function (a, b) { return (a.date || '') < (b.date || '') ? -1 : 1; }).map(function (y) {
        var acts = '';
        if (y.status === 'pending') acts = '<button class="btn sm ok" data-pay="approved" data-id="' + y.id + '">Approve</button><button class="btn sm ghost" data-pay="withheld" data-id="' + y.id + '">Withhold</button><button class="btn sm danger" data-pay="rejected" data-id="' + y.id + '">Reject</button>';
        else if (y.status === 'approved') acts = '<button class="btn sm" data-pay="paid" data-id="' + y.id + '">Mark paid</button><button class="btn sm ghost" data-pay="withheld" data-id="' + y.id + '">Withhold</button>';
        else if (y.status === 'withheld' || y.status === 'rejected') acts = '<button class="btn sm ghost" data-pay="pending" data-id="' + y.id + '">Reopen</button>';
        else if (y.status === 'awaiting_funds' || y.status === 'rate_pending') acts = '<button class="btn sm ghost" data-pay="pro_bono" data-id="' + y.id + '">Mark pro bono</button>';
        return '<tr><td><b>' + esc(y.facilitator) + '</b></td><td>Session ' + esc(y.number) + '<div class="small muted">' + H.date(y.date) + '</div></td><td class="num">' + H.money(y.gross) + '</td><td class="num">' + H.money(y.acri_cut) + '</td><td class="num"><b>' + H.money(y.net) + '</b></td><td>' + H.pill(H.PAY, y.status) +
          (y.reason ? '<div class="small muted">' + esc(y.reason) + '</div>' : '') + (y.paid_ref ? '<div class="small muted">Ref ' + esc(y.paid_ref) + ' · ' + esc(y.paid_on) + '</div>' : '') + '</td><td><div class="row-actions">' + acts + '</div></td></tr>';
      });
    return card('Payments · ' + p.name, table(['Facilitator', 'Session', '#Gross', '#ACRI cut', '#Net', 'Status', 'Actions'], rows, 'No payable sessions yet.'),
      '<button class="btn sm ghost" id="rc">Recalculate open payments</button>');
  };
  function sharePayments(p, x) {
    var sc = p.share, f = p.fund;
    var lines = sc.lines.map(function (l) {
      return '<tr><td><b>' + esc(l.name) + '</b></td><td class="num">' + l.share_pct + '%' + (x.me.canFund ? ' <button class="btn sm ghost" data-share="' + l.facilitator_id + '|' + l.share_pct + '">Change</button>' : '') + '</td>' +
        '<td class="num">' + l.attended + ' / ' + l.held + '</td><td class="num">' + H.money(l.full) + '</td><td class="num">' + (l.absence_cut ? '−' + H.money(l.absence_cut) : '—') + '</td>' +
        '<td class="num"><b>' + H.money(l.entitlement) + '</b></td><td class="num">' + H.money(l.previous) + '</td><td class="num"><b>' + H.money(l.due) + '</b></td></tr>';
    });
    var outs = x.payouts.filter(function (o) { return o.programme_id === p.id; }).map(function (o) {
      var acts = '';
      if (o.status === 'pending') acts = '<button class="btn sm ok" data-po="approved" data-id="' + o.id + '">Approve</button><button class="btn sm ghost" data-po="withheld" data-id="' + o.id + '">Withhold</button><button class="btn sm danger" data-po="rejected" data-id="' + o.id + '">Reject</button>';
      else if (o.status === 'approved') acts = '<button class="btn sm" data-po="paid" data-id="' + o.id + '">Mark paid</button><button class="btn sm ghost" data-po="withheld" data-id="' + o.id + '">Withhold</button>';
      else if (o.status === 'withheld' || o.status === 'rejected') acts = '<button class="btn sm ghost" data-po="pending" data-id="' + o.id + '">Reopen</button>';
      return '<tr><td>' + H.date(o.created_at.slice(0, 10)) + '</td><td><b>' + esc(o.facilitator) + '</b></td><td class="small">' + esc(o.basis) + '</td><td class="num"><b>' + H.money(o.amount) + '</b></td><td>' + H.pill(H.PAYOUT, o.status) +
        (o.reason ? '<div class="small muted">' + esc(o.reason) + '</div>' : '') + (o.paid_ref ? '<div class="small muted">Ref ' + esc(o.paid_ref) + ' · ' + esc(o.paid_on) + '</div>' : '') + '</td><td><div class="row-actions">' + acts + '</div></td></tr>';
    });
    var due = sc.lines.reduce(function (t, l) { return t + l.due; }, 0);
    var warn = sc.totalPct > 100.01 ? '<div class="note err" style="margin:12px 18px">Shares add up to ' + sc.totalPct + '%. They must not be more than 100%.</div>' : '';
    return '<h1>Facilitator shares</h1><p class="lead">The lump sum from the school, minus ACRI\'s deductions, leaves <b>' + H.money(sc.pool) + '</b> for facilitators. It is split by share %, and each person\'s part is reduced by the sessions they missed (' + sc.held + ' sessions held so far; extra sessions are pro bono and not counted). Money not paid out because of missed sessions stays in the fund.</p>' +
      card('Shares as of today', warn + table(['Facilitator', '#Share', '#Attended', '#Full share', '#Missed sessions', '#Share so far', '#Already paid', '#Due now'], lines, 'No facilitators assigned.'),
        x.me.canFund ? '<button class="btn sm ok" id="dist"' + (due > 0 ? '' : ' disabled') + '>Pay out ' + H.money(due) + '</button>' : '<span class="small muted">The Vice President pays out shares</span>') +
      card('Payments', table(['Date', 'Facilitator', 'How it was worked out', '#Amount', 'Status', 'Actions'], outs, 'No payments yet.'));
  }

  BIND.payments = function () {
    var dist = document.getElementById('dist');
    if (dist) dist.onclick = function () {
      H.form('Pay out shares', [{ name: 'ok', label: 'I have checked the shares. Create these payments and email each facilitator.', type: 'checkbox', value: true }], 'Create payments',
        function (v) { if (!v.ok) return { ok: false, error: 'Tick the box to confirm.' }; return api('distributeFund', { programme_id: prog().id }).then(function (r) { if (r.ok) H.toast('Payments created. Emails sent.'); return r; }); });
    };
    app.querySelectorAll('[data-share]').forEach(function (b) { b.onclick = function () {
      var q = b.dataset.share.split('|');
      H.form('Change share', [{ name: 'share_pct', label: 'Share of the facilitator pool (%)', type: 'number', step: '0.01', value: q[1], help: 'Leave empty to split equally with the others' }], 'Save',
        function (v) { return api('setShare', { programme_id: prog().id, facilitator_id: q[0], share_pct: v.share_pct }); });
    }; });
    app.querySelectorAll('[data-po]').forEach(function (b) { b.onclick = function () {
      var st = b.dataset.po, id = b.dataset.id;
      if (st === 'approved' || st === 'pending') return api('setPayoutStatus', { payout_id: id, status: st }).then(function (r) { if (r.ok) H.toast('Updated. Email sent.'); });
      var fields = st === 'paid' ? [{ name: 'paid_ref', label: 'Payment reference (UTR)', required: true }, { name: 'paid_on', label: 'Paid on', type: 'date', value: today }] : [{ name: 'reason', label: 'Reason', type: 'textarea', required: true }];
      H.form({ paid: 'Mark as paid', withheld: 'Withhold payment', rejected: 'Reject payment' }[st], fields, 'Confirm', function (v) { return api('setPayoutStatus', Object.assign({ payout_id: id, status: st }, v)); });
    }; });
    var rc = document.getElementById('rc'); if (rc) rc.onclick = function () { api('recalculatePayments', { programme_id: prog().id }).then(function (r) { if (r.ok) H.toast('Recalculated.'); }); };
    app.querySelectorAll('[data-pay]').forEach(function (b) {
      b.onclick = function () {
        var st = b.dataset.pay, id = b.dataset.id;
        if (st === 'approved' || st === 'pending') return api('setPaymentStatus', { payment_id: id, status: st }).then(function (r) { if (r.ok) H.toast('Updated. Email sent.'); });
        var fields = st === 'paid' ? [{ name: 'paid_ref', label: 'Payment reference (UTR)', required: true }, { name: 'paid_on', label: 'Paid on', type: 'date', value: today }]
          : [{ name: 'reason', label: st === 'pro_bono' ? 'Note (optional)' : 'Reason', type: 'textarea', required: st !== 'pro_bono', value: st === 'pro_bono' ? 'Extra session; no funds available. Conducted pro bono as an education-first institution.' : '' }];
        var title = { paid: 'Mark as paid', withheld: 'Withhold payment', rejected: 'Reject payment (discrepancy)', pro_bono: 'Record as pro bono' }[st];
        H.form(title, fields, 'Confirm', function (v) { return api('setPaymentStatus', Object.assign({ payment_id: id, status: st }, v)); });
      };
    });
  };

  VIEWS.fund = function () {
    var p = prog(), x = d(), f = p.fund;
    var entries = x.fundEntries.filter(function (e) { return e.programme_id === p.id; }).map(function (e) {
      return '<tr><td>' + H.date(e.date) + '</td><td>' + (e.type === 'credit' ? '<span class="pill green">Received</span>' : '<span class="pill red">Deduction</span>') + '</td><td>' + esc(e.head) + '</td><td class="num">' + (e.type === 'credit' ? '+' : '−') + H.money(e.amount) + '</td><td class="small">' + esc(e.note) + '</td><td class="small muted">' + esc(e.recorded_by) + '</td></tr>';
    });
    var heads = f.byHead.map(function (h) { return '<tr><td>' + esc(h.head) + '</td><td class="num">' + H.money(h.amount) + '</td></tr>'; });
    var headList = x.deductionHeads.map(function (h) { return '<tr><td><b>' + esc(h.name) + '</b><div class="small muted">' + esc(h.description) + '</div></td><td>' + (h.active === 'TRUE' ? '<span class="pill green">Active</span>' : '<span class="pill">Inactive</span>') + '</td><td>' + (x.me.canFund ? '<button class="btn sm ghost" data-head="' + h.id + '">Edit</button>' : '') + '</td></tr>'; });
    var tools = x.me.canFund ? '<button class="btn sm ok" id="cr">Record money received</button><button class="btn sm danger" id="de">Record ACRI deduction</button>' : '<span class="small muted">Only the Vice President or owner can record entries</span>';
    return '<h1>ACRI Abhivyakti Fund</h1><p class="lead">Money received for ' + esc(p.name) + ', ACRI\'s deductions by head, and what is left for facilitators. Entries are final once recorded and cannot be edited or deleted.</p>' +
      '<div class="stats"><div class="stat"><div class="k">Received</div><div class="v">' + H.money(f.received) + '</div></div>' +
      '<div class="stat"><div class="k">ACRI deductions</div><div class="v">' + H.money(f.deducted) + '</div></div>' +
      '<div class="stat"><div class="k">Facilitator pool</div><div class="v">' + H.money(f.pool) + '</div><div class="s">' + H.money(f.committed) + ' committed · ' + H.money(f.paid) + ' paid</div></div>' +
      '<div class="stat hl"><div class="k">Available</div><div class="v">' + H.money(f.available) + '</div></div></div>' +
      card('Fund ledger', table(['Date', 'Type', 'Head', '#Amount', 'Note', 'Recorded by'], entries, 'No entries yet. The Vice President records money as it is received.'), tools) +
      '<div class="grid2">' + card('Deductions by head', table(['Head', '#Total'], heads, 'No deductions yet.')) +
      card('Deduction heads', table(['Head', 'Status', ''], headList), x.me.canFund ? '<button class="btn sm ghost" id="nh">Add head</button>' : '') + '</div>';
  };
  BIND.fund = function () {
    var p = prog(), x = d();
    var cr = document.getElementById('cr'), de = document.getElementById('de'), nh = document.getElementById('nh');
    if (cr) cr.onclick = function () {
      H.form('Record money received', [{ name: 'amount', label: 'Amount (₹)', type: 'number', required: true }, { name: 'date', label: 'Date received', type: 'date', value: today, required: true }, { name: 'head', label: 'Source', value: 'Fees received from Apple Global School' }, { name: 'note', label: 'Note / reference', type: 'textarea' }], 'Record',
        function (v) { return api('addFundEntry', Object.assign({ programme_id: p.id, type: 'credit' }, v)).then(function (r) { if (r.ok) H.toast('Recorded. Open payments recalculated.'); return r; }); });
    };
    if (de) de.onclick = function () {
      var opts = x.deductionHeads.filter(function (h) { return h.active === 'TRUE'; }).map(function (h) { return h.name; });
      H.form('Record ACRI deduction', [{ name: 'head', label: 'Deduction head', type: 'select', options: opts }, { name: 'amount', label: 'Amount (₹)', type: 'number', required: true }, { name: 'date', label: 'Date', type: 'date', value: today, required: true }, { name: 'note', label: 'Note', type: 'textarea' }, { name: 'confirm', label: 'I understand this deduction is final and cannot be changed later', type: 'checkbox' }], 'Record',
        function (v) { if (!v.confirm) return { ok: false, error: 'Please confirm that this deduction is final.' }; return api('addFundEntry', Object.assign({ programme_id: p.id, type: 'deduction' }, v)).then(function (r) { if (r.ok) H.toast('Deduction recorded.'); return r; }); });
    };
    function headForm(h) {
      H.form(h ? 'Edit deduction head' : 'Add deduction head', [{ name: 'name', label: 'Title', required: true, value: h && h.name }, { name: 'description', label: 'What it covers', value: h && h.description }, { name: 'active', label: 'Active', type: 'select', options: [['TRUE', 'Active'], ['FALSE', 'Inactive']], value: h ? h.active : 'TRUE' }], 'Save',
        function (v) { return api('saveDeductionHead', Object.assign({ id: h && h.id }, v)); });
    }
    if (nh) nh.onclick = function () { headForm(null); };
    app.querySelectorAll('[data-head]').forEach(function (b) { b.onclick = function () { headForm(x.deductionHeads.filter(function (h) { return h.id === b.dataset.head; })[0]); }; });
  };

  VIEWS.facilitators = function () {
    var x = d();
    var rows = x.facilitators.map(function (f) {
      var progs = x.assignments.filter(function (a) { return a.facilitator_id === f.id && a.status !== 'ended'; }).map(function (a) { var p = x.programmes.filter(function (q) { return q.id === a.programme_id; })[0]; return p ? p.name : ''; }).join(', ');
      return '<tr><td><b>' + esc(f.name) + '</b><div class="small muted">' + esc(f.email) + (f.phone ? ' · ' + esc(f.phone) : '') + '</div></td><td class="small">' + esc(progs) + '</td><td class="small">' + esc(f.appointment_ref || '—') + '<div class="muted">' + esc(f.appointed_on || '') + '</div></td><td>' + (f.status === 'active' ? '<span class="pill green">Active</span>' : '<span class="pill">Inactive</span>') + '</td>' +
        '<td><div class="row-actions"><button class="btn sm ghost" data-edit="' + f.id + '">Edit</button><button class="btn sm ghost" data-reset="' + f.id + '">Send new password</button><button class="btn sm ghost" data-mail="' + f.id + '">Email</button><button class="btn sm ' + (f.status === 'active' ? 'danger' : 'ok') + '" data-st="' + f.id + '|' + (f.status === 'active' ? 'inactive' : 'active') + '">' + (f.status === 'active' ? 'Deactivate' : 'Activate') + '</button></div></td></tr>';
    });
    return card('Facilitators', table(['Name', 'Programmes', 'Appointment', 'Status', 'Actions'], rows), '<button class="btn sm ghost" id="ma">Email all</button><button class="btn sm" id="nf">Appoint facilitator</button>');
  };
  BIND.facilitators = function () {
    var x = d();
    function facForm(f) {
      var fields = [{ name: 'name', label: 'Full name', required: true, value: f && f.name }, { name: 'email', label: 'Email', type: 'email', required: true, value: f && f.email }, { name: 'phone', label: 'Phone', value: f && f.phone },
        { name: 'appointment_ref', label: 'Appointment letter ref.', value: f && f.appointment_ref }, { name: 'appointed_on', label: 'Appointed from', type: 'date', value: (f && f.appointed_on) || today },
        { name: 'programme_id', label: 'Assign to programme', type: 'select', options: x.programmes.map(function (p) { return [p.id, p.name]; }), value: state.prog }];
      if (!f) fields.push({ name: 'send_welcome', label: 'Email login details now', type: 'checkbox', value: true });
      H.form(f ? 'Edit facilitator' : 'Appoint facilitator', fields, 'Save', function (v) { return api('saveFacilitator', Object.assign({ id: f && f.id }, v)).then(function (r) { if (r.ok) H.toast(f ? 'Saved.' : 'Facilitator added.'); return r; }); });
    }
    function mailForm(to, label) {
      H.form('Email ' + label, [{ name: 'subject', label: 'Subject', required: true }, { name: 'message', label: 'Message', type: 'textarea', required: true }], 'Send',
        function (v) { return api('sendEmail', Object.assign({ to: to }, v)).then(function (r) { if (r.ok) H.toast('Email sent.'); return r; }); });
    }
    document.getElementById('nf').onclick = function () { facForm(null); };
    document.getElementById('ma').onclick = function () { mailForm('all', 'all active facilitators'); };
    app.querySelectorAll('[data-edit]').forEach(function (b) { b.onclick = function () { facForm(x.facilitators.filter(function (f) { return f.id === b.dataset.edit; })[0]); }; });
    app.querySelectorAll('[data-mail]').forEach(function (b) { b.onclick = function () { var f = x.facilitators.filter(function (y) { return y.id === b.dataset.mail; })[0]; mailForm(f.id, f.name); }; });
    app.querySelectorAll('[data-reset]').forEach(function (b) { b.onclick = function () { api('resetFacilitatorPassword', { id: b.dataset.reset }).then(function (r) { if (r.ok) H.toast('New temporary password emailed.'); }); }; });
    app.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { var s = b.dataset.st.split('|'); api('setFacilitatorStatus', { id: s[0], status: s[1] }); }; });
  };

  VIEWS.programme = function () {
    var p = prog(), x = d();
    var sess = x.sessions.filter(function (s) { return s.programme_id === p.id; }).map(function (s) {
      return '<tr><td><b>' + esc(s.number) + '</b>' + (s.extra === 'TRUE' ? ' <span class="pill blue">Extra</span>' : '') + '</td><td>' + H.date(s.date) + '</td><td class="small">' + esc(s.group) + '</td><td>' + esc(s.mode) + '</td><td class="small">' + esc(s.topic) + '</td><td>' + esc(s.status) + '</td><td><button class="btn sm ghost" data-s="' + s.id + '">Edit</button></td></tr>';
    });
    var info = '<div style="padding:16px 18px"><div class="grid2"><div><div class="small muted">Payment model</div><b>' + esc(MODEL[p.pay_model]) + '</b></div><div><div class="small muted">' + (p.pay_model === 'share' ? 'Facilitator pool now' : 'Per session (after ACRI cut)') + '</div><b>' + (p.pay_model === 'share' ? H.money(p.fund.pool) + '</b> <span class="small muted">· shares on the Payments tab</span>' : (p.session_net == null ? 'Not set' : H.money(p.session_net)) + '</b>') + '</div>' +
      '<div style="margin-top:10px"><div class="small muted">Students · planned sessions</div><b>' + p.students + ' · ' + p.planned_sessions + '</b></div><div style="margin-top:10px"><div class="small muted">ACRI cut on each session</div><b>' + p.acri_cut_pct + '%</b></div></div></div>';
    return card(p.name + ' · payment settings', info, '<button class="btn sm" id="ep">Edit payment settings</button>') +
      card('Sessions', table(['No.', 'Date', 'Group', 'Mode', 'Topic', 'Status', ''], sess), '<button class="btn sm" id="ns">Add session</button>');
  };
  BIND.programme = function () {
    var p = prog(), x = d();
    document.getElementById('ep').onclick = function () {
      H.form('Payment settings · ' + p.name, [
        { name: 'name', label: 'Programme name', value: p.name, required: true }, { name: 'school', label: 'School', value: p.school },
        { name: 'pay_model', label: 'How a session is priced', type: 'select', value: p.pay_model, options: Object.keys(MODEL).map(function (k) { return [k, MODEL[k]]; }) },
        { name: 'rate_per_session', label: 'Flat rate per session (₹)', type: 'number', value: p.rate_per_session, help: 'Used with "Flat rate per session"' },
        { name: 'pool_per_student', label: 'Amount per student (₹)', type: 'number', value: p.pool_per_student, help: 'Used with "Per-student amount"' },
        { name: 'students', label: 'Students', type: 'number', value: p.students }, { name: 'planned_sessions', label: 'Planned sessions', type: 'number', value: p.planned_sessions, help: 'Change this if more sessions are added' },
        { name: 'acri_cut_pct', label: 'ACRI cut on each session (%)', type: 'number', step: '0.01', value: p.acri_cut_pct },
        { name: 'recalculate', label: 'Recalculate open payments with these settings', type: 'checkbox', value: true }], 'Save',
        function (v) { return api('saveProgramme', Object.assign({ id: p.id }, v)).then(function (r) { if (r.ok) H.toast('Saved.'); return r; }); });
    };
    function sessForm(s) {
      H.form(s ? 'Edit session' : 'Add session', [{ name: 'number', label: 'Session number', value: s ? s.number : '' }, { name: 'date', label: 'Date', type: 'date', required: true, value: s ? s.date : '' },
        { name: 'group', label: 'Group(s)', value: s ? s.group : 'All groups' }, { name: 'mode', label: 'Mode', type: 'select', options: [['online', 'Online'], ['offline', 'Offline']], value: s ? s.mode : 'online' },
        { name: 'topic', label: 'Topic', value: s ? s.topic : '' }, { name: 'status', label: 'Status', type: 'select', options: ['scheduled', 'held', 'cancelled'], value: s ? s.status : 'scheduled' },
        { name: 'extra', label: 'Extra session (pro bono if the fund cannot cover it)', type: 'checkbox', value: s ? s.extra === 'TRUE' : false }], 'Save',
        function (v) { return api('saveSession', Object.assign({ id: s && s.id, programme_id: p.id }, v)); });
    }
    document.getElementById('ns').onclick = function () { sessForm(null); };
    app.querySelectorAll('[data-s]').forEach(function (b) { b.onclick = function () { sessForm(x.sessions.filter(function (s) { return s.id === b.dataset.s; })[0]); }; });
  };

  VIEWS.queries = function () {
    var qs = d().queries;
    return card('Queries', qs.length ? qs.map(function (q) {
      return '<div class="query"><b>' + esc(q.subject) + '</b> · ' + esc(q.facilitator) + ' ' + (q.status === 'open' ? '<span class="pill amber">Open</span>' : '<span class="pill green">' + esc(q.status) + '</span>') + '<div class="small muted">' + esc(q.created_at.slice(0, 10)) + '</div><div>' + esc(q.message) + '</div>' +
        (q.response ? '<div class="r"><b>Response:</b> ' + esc(q.response) + '</div>' : '') + (q.status !== 'closed' ? '<div style="margin-top:8px"><button class="btn sm" data-q="' + q.id + '">Respond</button></div>' : '') + '</div>';
    }).join('') : '<div class="empty">No queries.</div>');
  };
  BIND.queries = function () {
    app.querySelectorAll('[data-q]').forEach(function (b) { b.onclick = function () {
      H.form('Respond to query', [{ name: 'response', label: 'Response (emailed to the facilitator)', type: 'textarea', required: true }, { name: 'close', label: 'Close the query', type: 'checkbox' }], 'Send',
        function (v) { return api('answerQuery', Object.assign({ query_id: b.dataset.q }, v)); });
    }; });
  };

  VIEWS.emails = function () {
    var rows = d().emails.map(function (e) { return '<tr><td class="small">' + esc(e.at.replace('T', ' ').slice(0, 16)) + '</td><td>' + esc(e.to) + '</td><td>' + esc(e.subject) + '</td><td>' + (e.status === 'sent' ? '<span class="pill green">Sent</span>' : '<span class="pill red" title="' + esc(e.error) + '">Failed</span>') + '</td></tr>'; });
    return card('Automatic emails (last 50)', table(['When (UTC)', 'To', 'Subject', 'Status'], rows, 'No emails sent yet.'), '<span class="small muted">Sent through Zoho Mail</span>');
  };

  VIEWS.team = function () {
    var x = d();
    var rows = x.admins.map(function (a) { return '<tr><td><b>' + esc(a.name) + '</b><div class="small muted">' + esc(a.email) + '</div></td><td>' + esc(ROLE[a.role] || a.role) + '</td><td>' + (a.active === 'TRUE' ? '<span class="pill green">Active</span>' : '<span class="pill">Disabled</span>') + '</td></tr>'; });
    var set = x.settings.map(function (s) { return '<tr><td><b>' + esc(s.key) + '</b></td><td>' + esc(s.value) + '</td></tr>'; });
    return card('Admin team', table(['Name', 'Role', 'Status'], rows), x.me.isOwner ? '<button class="btn sm" id="na">Add admin</button>' : '') +
      card('Settings', table(['Key', 'Value'], set), '<button class="btn sm ghost" id="es">Edit settings</button><button class="btn sm ghost" id="cp">Change my password</button>');
  };
  BIND.team = function () {
    var x = d();
    var na = document.getElementById('na');
    if (na) na.onclick = function () {
      H.form('Add admin', [{ name: 'name', label: 'Name', required: true }, { name: 'email', label: 'Email', type: 'email', required: true }, { name: 'role', label: 'Role', type: 'select', options: [['vp', 'Vice President (manages the fund)'], ['admin', 'Admin'], ['owner', 'Owner']] }], 'Add',
        function (v) { return api('saveAdmin', v).then(function (r) { if (r.ok) H.toast('Admin added. Login details emailed.'); return r; }); });
    };
    document.getElementById('es').onclick = function () {
      var get = function (k, dflt) { var s = x.settings.filter(function (y) { return y.key === k; })[0]; return s ? s.value : dflt; };
      H.form('Settings', [{ name: 'ADMIN_NOTIFY_EMAIL', label: 'Email for new submissions and queries', value: get('ADMIN_NOTIFY_EMAIL', '') }, { name: 'PORTAL_URL', label: 'Portal address', value: get('PORTAL_URL', 'https://hr.acriindia.org.in') },
        { name: 'SHOW_FUND_TO_FACILITATORS', label: 'Show the fund summary to facilitators', type: 'select', options: [['TRUE', 'Yes'], ['FALSE', 'No']], value: get('SHOW_FUND_TO_FACILITATORS', 'TRUE') }], 'Save',
        function (v) { return api('saveSettings', { settings: Object.keys(v).map(function (k) { return { key: k, value: v[k] }; }) }); });
    };
    document.getElementById('cp').onclick = function () {
      H.form('Change my password', [{ name: 'current', label: 'Current password', type: 'password', required: true }, { name: 'next', label: 'New password (8+ characters)', type: 'password', required: true }], 'Change',
        function (v) { return api('changePassword', v).then(function (r) { if (r.ok) H.toast('Password changed.'); return r; }); });
    };
  };

  if (state.token) api('dashboard').then(function (r) { if (!r.ok) renderLogin(); }); else renderLogin();
})();
</script>
